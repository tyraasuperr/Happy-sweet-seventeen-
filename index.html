<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { text-align: center; font-family: 'Comic Sans MS', cursive; background: #fff0f5; padding-top: 50px; }
        .halaman-awal { cursor: pointer; padding: 20px; border: 2px dashed #d63384; display: inline-block; border-radius: 20px; background: white; }
        #konten-kejutan { display: none; }
        .cake { font-size: 100px; margin-top: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .pesan { font-size: 22px; color: #d63384; font-weight: bold; margin-top: 20px; padding: 20px; }
    </style>
</head>
<body>

    <div id="halaman-awal" class="halaman-awal" onclick="bukaKejutan()">
        <h1>Eh, ada sesuatu buat kamu nih! 👀</h1>
        <p>Coba klik di sini dulu...</p>
    </div>

    <div id="konten-kejutan">
        <h1>Happy Sweet Seventeen, Ika Widyanurit! 🎂</h1>
        <div class="cake">🎂</div>
        <div class="pesan">
            <p>Di hari yang special ini, apapun yang menjadi harapan, doa dan wishlist kamu pasti akan tercapai! ✨</p>
        </div>
    </div>

    <script>
        function bukaKejutan() {
            document.getElementById('halaman-awal').style.display = 'none';
            document.getElementById('konten-kejutan').style.display = 'block';
        }
    </script>
</body>
</html>
